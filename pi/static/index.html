<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=800, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Lock In — Pi</title>
<style>
  :root {
    --ink: #ffffff;
    --gray: #8e8e93;
    --gray-dim: #636366;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --surface-3: #3a3a3c;
    --hair: rgba(255, 255, 255, .08);
    --specular: rgba(255, 255, 255, .14);
    --red: #ff453a;
    --blue: #0a84ff;
    --green: #30d158;
    --canvas: #000000;
    --page: #050506;
  }
  body.light {
    --ink: #000000;
    --gray: #6e6e73;
    --gray-dim: #8e8e93;
    --surface: #f2f2f7;
    --surface-2: #e9e9ee;
    --surface-3: #ffffff;
    --hair: rgba(0, 0, 0, .09);
    --specular: rgba(255, 255, 255, .9);
    --canvas: #ffffff;
    --page: #e9e9ee;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--page);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: var(--ink);
    transition: background .25s ease;
  }

  /* 800x480 device: never upscaled, only shrunk to fit a smaller window */
  #stage { width: 800px; height: 480px; flex: none; transform-origin: center center; }

  #frame {
    position: relative;
    width: 800px;
    height: 480px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 28px;
    background: var(--canvas);
    border: 1px solid rgba(255, 255, 255, .15);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    color: var(--ink);
    transition: border-color .3s ease, box-shadow .3s ease, background .25s ease, color .25s ease;
  }
  body.light #frame {
    border-color: rgba(0, 0, 0, .12);
    box-shadow: 0 20px 50px rgba(0, 0, 0, .18);
  }
  #frame.locked {
    border: 4px solid var(--red);
    box-shadow: inset 0 0 28px rgba(255, 69, 58, .22), 0 0 24px rgba(255, 69, 58, .22);
  }

  /* ---------- header ---------- */
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding: 14px 22px 6px;
    flex: none;
  }
  .icons { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .icon {
    width: 32px; height: 32px; display: grid; place-items: center;
    border: 0; border-radius: 10px; background: transparent;
    color: var(--gray); cursor: pointer;
    transition: background .16s ease, color .16s ease, transform .15s ease;
  }
  button.icon:active { transform: scale(.92); background: var(--surface); }
  .icon svg { width: 18px; height: 18px; display: block; }
  .icon.is-on { color: var(--ink); }
  .icon.is-blue { color: var(--blue); }
  .icon.is-off { color: var(--gray-dim); opacity: .55; }

  .segmented {
    display: flex; align-items: center; gap: 4px;
    padding: 4px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--hair);
  }
  .seg {
    border: 0; border-radius: 999px; cursor: pointer;
    padding: 6px 20px; background: transparent; color: var(--gray);
    font: inherit; font-size: 14px; font-weight: 500;
    transition: background .18s ease, color .18s ease, transform .15s ease;
  }
  .seg.active {
    background: var(--surface-3); color: var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .35), inset 0 1px 0 var(--specular);
  }
  body.light .seg.active { box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .seg:active { transform: scale(.97); }

  /* ---------- sliding view track ---------- */
  main { flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
  #track {
    display: flex; width: 100%; height: 100%;
    transition: transform .34s cubic-bezier(.32, .72, 0, 1);
    will-change: transform;
  }
  .view { flex: 0 0 100%; height: 100%; min-width: 0; display: flex; flex-direction: column; padding: 8px 22px 20px; }

  /* ---------- home ---------- */
  .home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding-top: 2px; min-height: 0; }
  .hero { display: flex; flex-direction: column; align-items: center; }
  .clock {
    font-size: 124px; line-height: .95; font-weight: 700;
    letter-spacing: -.05em; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .clock.small { font-size: 94px; }
  .subclock { margin-top: 6px; font-size: 22px; font-weight: 500; letter-spacing: -.02em; color: var(--gray); font-variant-numeric: tabular-nums; }

  .action-row { display: flex; align-items: center; gap: 10px; }
  .pills { display: flex; align-items: center; gap: 2px; height: 52px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); }
  .pill {
    height: 44px; border: 0; border-radius: 999px; cursor: pointer;
    padding: 0 13px; background: transparent; color: var(--gray);
    font: inherit; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
    transition: background .18s ease, color .18s ease, transform .15s ease;
  }
  .pill.active { background: var(--ink); color: var(--canvas); font-weight: 600; }
  .pill:active { transform: scale(.95); }

  .lock-btn {
    height: 52px; border: 0; border-radius: 999px; cursor: pointer;
    padding: 0 32px; background: var(--red); color: #fff;
    font: inherit; font-size: 16px; font-weight: 600; letter-spacing: -.01em;
    box-shadow: 0 6px 20px rgba(255, 69, 58, .35);
    transition: transform .15s ease, background .2s ease;
  }
  .lock-btn:active { transform: scale(.97); background: #ff5e54; }
  .lock-btn:disabled { opacity: .35; cursor: default; box-shadow: none; }

  .hint { height: 16px; padding-top: 6px; font-size: 11.5px; color: var(--gray); text-align: center; }
  #action { width: 100%; display: flex; flex-direction: column; align-items: center; }

  .hold {
    position: relative; width: 288px; height: 48px; overflow: hidden; cursor: pointer;
    border-radius: 999px; border: 1px solid rgba(255, 69, 58, .4); background: var(--surface);
    color: var(--red); font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .02em;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease;
  }
  .hold:active { transform: scale(.98); }
  .hold:disabled { border-color: var(--hair); color: var(--gray-dim); cursor: default; }
  .hold-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255, 69, 58, .25); }
  .hold-label { position: relative; }

  /* ---------- locked context ---------- */
  .locked-info { width: 100%; max-width: 660px; display: flex; flex-direction: column; gap: 8px; padding: 12px 0 4px; }
  .msg-card {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-radius: 14px; background: var(--surface); border: 1px solid var(--hair);
  }
  .msg-card.urgent { background: rgba(255, 69, 58, .12); border-color: rgba(255, 69, 58, .35); }
  .msg-card .txt { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg-card .who { font-weight: 600; }
  .msg-card .act {
    flex: none; border: 0; border-radius: 999px; padding: 7px 13px; cursor: pointer;
    background: var(--red); color: #fff; font: inherit; font-size: 12px; font-weight: 600;
  }
  .digest-line {
    font-size: 12px; color: var(--gray); line-height: 1.35; padding: 0 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ---------- to-do ---------- */
  .todo-wrap { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 0; min-height: 0; }
  .todo-head { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .todo-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
  .todo-head span { font-size: 12px; font-weight: 500; color: var(--gray); margin-left: auto; }
  .todo-head .add {
    width: 32px; height: 32px; flex: none; border-radius: 11px; cursor: pointer;
    border: 1px solid var(--hair); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 19px; font-weight: 500; line-height: 1;
    display: grid; place-items: center; transition: transform .15s ease, background .16s ease;
  }
  .todo-head .add:active { transform: scale(.93); background: var(--surface-3); }
  .todo-list {
    flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center;
    gap: 10px; margin: 8px 0; overflow-y: auto; overflow-x: hidden;
    overscroll-behavior: contain; scrollbar-width: none; touch-action: pan-y;
  }
  .todo-list::-webkit-scrollbar { display: none; }
  .todo {
    width: 100%; min-height: 58px; padding: 0 12px 0 16px; flex: none; cursor: pointer;
    display: flex; align-items: center; gap: 14px; text-align: left;
    border-radius: 16px; background: var(--surface);
    border: 1px solid var(--hair); border-top-color: var(--specular);
    color: var(--ink); font: inherit; font-size: 16px; font-weight: 500;
    transition: transform .15s ease;
  }
  .todo:active { transform: scale(.99); }
  .check {
    width: 24px; height: 24px; flex: none; border-radius: 50%;
    border: 2px solid var(--gray-dim); display: grid; place-items: center;
    transition: background .2s ease, border-color .2s ease;
  }
  .check svg { width: 14px; height: 14px; display: none; }
  .todo.done .check { background: var(--blue); border-color: var(--blue); color: #fff; }
  .todo.done .check svg { display: block; }
  .todo .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .todo.done .text { color: var(--gray-dim); text-decoration: line-through; }
  .todo .from { flex: none; font-size: 10px; color: var(--gray); border: 1px solid var(--hair); border-radius: 6px; padding: 2px 6px; letter-spacing: .03em; }
  .todo .del {
    flex: none; width: 28px; height: 28px; border: 0; border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--gray-dim); font: inherit; font-size: 19px; line-height: 1;
    display: grid; place-items: center;
  }
  .todo .del:active { background: var(--surface-2); color: var(--red); }
  .todo-foot { font-size: 12px; color: var(--gray); text-align: center; }
  .empty-list { color: var(--gray); font-size: 15px; text-align: center; }

  /* ---------- add-reminder sheet ---------- */
  .sheet {
    position: absolute; inset: 0; z-index: 50; display: none; align-items: flex-end;
    background: rgba(0, 0, 0, .45);
  }
  .sheet.open { display: flex; }
  .sheet-panel {
    width: 100%; padding: 14px 18px 22px;
    background: var(--canvas); border-top: 1px solid var(--hair);
    border-top-left-radius: 22px; border-top-right-radius: 22px;
    box-shadow: 0 -18px 40px rgba(0, 0, 0, .45);
  }
  .sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  .sheet-title { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--gray); }
  .sheet-cancel { margin-left: auto; border: 0; background: transparent; color: var(--blue); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; padding: 4px 2px; }
  #addInput {
    width: 100%; height: 42px; padding: 0 13px; outline: none;
    border-radius: 12px; border: 1px solid var(--hair); background: var(--surface);
    color: var(--ink); font: inherit; font-size: 15px;
  }
  #addInput::placeholder { color: var(--gray-dim); }
  .krow { display: flex; gap: 6px; justify-content: center; margin-top: 7px; }
  .key {
    height: 36px; flex: 0 0 64px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; font-weight: 500;
    transition: background .12s ease, transform .1s ease;
  }
  .key:active { background: var(--surface-3); transform: scale(.96); }
  .key.space { flex: 1 1 auto; max-width: 430px; }
  .key.wide { flex: 0 0 92px; color: var(--gray); font-size: 13px; }
  .key.go { flex: 0 0 96px; background: var(--blue); color: #fff; font-size: 13px; font-weight: 600; }

  /* ---------- weather ---------- */
  .weather-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .weather-card {
    width: 100%; max-width: 520px; border-radius: 24px; padding: 20px 24px;
    background: var(--surface); border: 1px solid var(--hair); border-top-color: var(--specular);
    box-shadow: 0 16px 40px rgba(0, 0, 0, .35);
  }
  body.light .weather-card { box-shadow: 0 12px 30px rgba(0, 0, 0, .1); }
  .weather-top { display: flex; align-items: center; justify-content: space-between; }
  .weather-loc { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .weather-updated { font-size: 11px; color: var(--gray); }
  .weather-main { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .weather-icon { width: 64px; height: 64px; color: var(--ink); flex: none; }
  .weather-temp { font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  .weather-cond { font-size: 16px; font-weight: 500; color: var(--gray); margin-top: 2px; }
  .weather-details { display: flex; gap: 18px; margin-top: 14px; font-size: 12px; color: var(--gray); }
  .weather-details b { color: var(--ink); font-weight: 600; }
  .weather-msg { font-size: 14px; color: var(--gray); text-align: center; padding: 24px 0; }

  /* ---------- music: boxes ---------- */
  .music-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .music-head { display: flex; align-items: baseline; justify-content: space-between; padding: 2px 4px 10px; }
  .music-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
  .music-head span { font-size: 12px; color: var(--gray); }
  .track-grid {
    flex: 1; min-height: 0; display: grid; gap: 10px;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-rows: 96px; align-content: center;
    overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    scrollbar-width: none; touch-action: pan-y;
  }
  .track-grid::-webkit-scrollbar { display: none; }
  .tile {
    position: relative; display: flex; flex-direction: column; justify-content: space-between;
    padding: 13px 15px; min-width: 0; cursor: pointer; text-align: left;
    border-radius: 18px; background: var(--surface);
    border: 1px solid var(--hair); border-top-color: var(--specular);
    color: var(--ink); font: inherit;
    transition: transform .15s ease, background .18s ease, border-color .18s ease;
  }
  .tile:active { transform: scale(.985); }
  .tile.playing { background: rgba(10, 132, 255, .13); border-color: rgba(10, 132, 255, .5); }
  body.light .tile.playing { background: rgba(0, 122, 255, .1); }
  .tile.selected { background: var(--surface-2); border-color: rgba(255, 255, 255, .18); }
  body.light .tile.selected { border-color: rgba(0, 0, 0, .14); }
  .tile .t {
    font-size: 15px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .tile .k { font-size: 10px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--gray); }
  .tile.playing .k { color: var(--blue); }
  .viz { position: absolute; right: 15px; bottom: 12px; display: flex; align-items: flex-end; gap: 3px; height: 16px; }
  .viz i { width: 3px; height: 100%; border-radius: 2px; background: var(--blue); transform-origin: bottom; animation: eq .95s ease-in-out infinite; }
  .viz i:nth-child(2) { height: 65%; animation-delay: -.35s; }
  .viz i:nth-child(3) { height: 85%; animation-delay: -.6s; }
  .viz i:nth-child(4) { height: 50%; animation-delay: -.15s; }
  @keyframes eq { 50% { transform: scaleY(.28); } }
  .viz.muted i { background: var(--gray-dim); animation: none; height: 26%; }
  .audio-note { font-size: 11px; color: var(--gray); text-align: center; padding-top: 10px; flex: none; }

  /* ---------- per-icon popovers ---------- */
  .icon-wrap { position: relative; }
  .popover {
    position: absolute; top: calc(100% + 10px); right: -4px; z-index: 30;
    width: 264px; padding: 14px; text-align: left;
    border-radius: 16px; background: var(--canvas);
    border: 1px solid var(--hair);
    box-shadow: 0 18px 44px rgba(0, 0, 0, .45);
    opacity: 0; transform: translateY(-6px) scale(.985); pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  body.light .popover { box-shadow: 0 16px 36px rgba(0, 0, 0, .16); }
  .icon-wrap.open .popover { opacity: 1; transform: none; pointer-events: auto; }
  .icon-wrap.open > .icon { background: var(--surface); }
  .popover h3 { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .popover .sub { font-size: 11.5px; color: var(--gray); margin-top: 3px; line-height: 1.35; }
  .popover .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 9px; margin-top: 9px; border-top: 1px solid var(--hair); }
  .kv { font-size: 11.5px; color: var(--gray); }
  .kv b { color: var(--ink); font-weight: 600; }
  .bt-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 124px; overflow-y: auto; scrollbar-width: none; }
  .bt-list::-webkit-scrollbar { display: none; }
  .bt-device { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface); }
  .bt-device .name { font-size: 12px; font-weight: 500; }
  .bt-device .addr { font-size: 10px; color: var(--gray); font-family: ui-monospace, Menlo, monospace; }
  .bt-act { border: 0; border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; background: var(--blue); color: #fff; }
  .scan-btn { width: 100%; height: 34px; margin-top: 10px; border-radius: 10px; border: 1px solid var(--hair); background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .scan-btn:active { transform: scale(.99); }
  .theme-toggle { display: flex; gap: 4px; padding: 4px; margin-top: 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); }
  .theme-toggle button { flex: 1; border: 0; border-radius: 999px; padding: 6px 10px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; background: transparent; color: var(--gray); }
  .theme-toggle button.active { background: var(--ink); color: var(--canvas); font-weight: 600; }

  .toast {
    position: absolute; left: 50%; bottom: 18px; z-index: 60;
    transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    max-width: 620px; padding: 9px 15px; border-radius: 12px;
    background: var(--surface-3); color: var(--ink); border: 1px solid var(--hair);
    font-size: 12.5px; text-align: center; box-shadow: 0 10px 26px rgba(0, 0, 0, .4);
    transition: opacity .16s ease, transform .16s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
    #track, .popover, .toast { transition: none; animation: none; }
    .viz i { animation: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <header>
        <div></div>
        <nav class="segmented" id="nav"></nav>
        <div class="icons">
          <div class="icon-wrap" data-popover="bt">
            <button class="icon" id="btBtn" type="button" aria-label="Bluetooth audio">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>
            </button>
            <div class="popover">
              <h3>Bluetooth Audio</h3>
              <div class="sub" id="btStatusText">Checking…</div>
              <div class="bt-list" id="btList"></div>
              <button class="scan-btn" id="btScan" type="button">Scan for devices</button>
            </div>
          </div>

          <div class="icon-wrap" data-popover="wifi">
            <button class="icon" id="wifiIcon" type="button" aria-label="Wi-Fi">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5a14 14 0 0 1 19 0"/><path d="M5.5 12a10 10 0 0 1 13 0"/><path d="M8.7 15.4a5.6 5.6 0 0 1 6.6 0"/><circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none"/></svg>
            </button>
            <div class="popover">
              <h3>Wi-Fi</h3>
              <div class="sub" id="wifiState">Checking…</div>
              <div class="row"><span class="kv">Network</span><span class="kv"><b id="wifiSsid">—</b></span></div>
              <div class="row"><span class="kv">Address</span><span class="kv"><b id="wifiIp">—</b></span></div>
              <div class="row"><span class="kv">Host</span><span class="kv"><b id="wifiHost">—</b></span></div>
            </div>
          </div>

          <div class="icon-wrap" data-popover="link">
            <button class="icon" id="linkIcon" type="button" aria-label="Connection status">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a4.5 4.5 0 0 0 6.4 0l2.1-2.1a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M13.5 10.5a4.5 4.5 0 0 0-6.4 0l-2.1 2.1a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
            </button>
            <div class="popover">
              <h3>Laptop Link</h3>
              <div class="sub" id="linkState">Connecting…</div>
              <div class="row"><span class="kv">Server</span><span class="kv"><b id="linkAddr">—</b></span></div>
              <div class="row"><span class="kv">Last sync</span><span class="kv"><b id="linkSync">—</b></span></div>
            </div>
          </div>

          <div class="icon-wrap" data-popover="gear">
            <button class="icon" id="gearBtn" type="button" aria-label="Appearance">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.1 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a1.9 1.9 0 1 1-3.8 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a1.9 1.9 0 1 1 0-3.8h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V3a1.9 1.9 0 1 1 3.8 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.2a1.9 1.9 0 1 1 0 3.8h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
            </button>
            <div class="popover">
              <h3>Appearance</h3>
              <div class="sub">Switch between dark and light</div>
              <div class="theme-toggle" id="themeToggle">
                <button data-theme="dark" type="button">Dark</button>
                <button data-theme="light" type="button">Light</button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main>
        <div id="track">
          <section class="view" data-view="Home">
            <div class="home">
              <div></div>
              <div class="hero" id="hero"></div>
              <div id="action"></div>
            </div>
          </section>

          <section class="view" data-view="To-do">
            <div class="todo-wrap">
              <div class="todo-head">
                <h2>Reminders</h2>
                <span id="todoCount">0 remaining</span>
                <button class="add" id="addBtn" type="button" aria-label="Add reminder">+</button>
              </div>
              <div class="todo-list" id="todoList"></div>
              <p class="todo-foot" id="todoFoot">Tap + to add a reminder on the Pi</p>
            </div>
          </section>

          <section class="view" data-view="Weather">
            <div class="weather-wrap" id="weatherWrap"></div>
          </section>

          <section class="view" data-view="Music">
            <div class="music-wrap">
              <div class="music-head">
                <h2>Music</h2>
                <span id="nowPlaying">Silence</span>
              </div>
              <div class="track-grid" id="trackGrid"></div>
              <div class="audio-note" id="audioNote"></div>
            </div>
          </section>
        </div>
      </main>

      <!-- add-reminder sheet: works on a bare touchscreen, no companion app needed -->
      <div class="sheet" id="sheet">
        <div class="sheet-panel">
          <div class="sheet-head">
            <span class="sheet-title">New reminder</span>
            <button class="sheet-cancel" id="sheetCancel" type="button">Cancel</button>
          </div>
          <input id="addInput" type="text" inputmode="none" autocomplete="off" spellcheck="false" maxlength="120" placeholder="What needs doing?" />
          <div id="keyboard"></div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <audio id="player" preload="none"></audio>

<script>
  const DURATIONS = [1, 15, 30, 45, 60];
  const SILENCE = { title: "Silence", kind: "silence", label: "Off" };
  const SYNTH = [
    { title: "White Noise", kind: "synth", synth: "white", label: "Generated" },
    { title: "Brown Noise", kind: "synth", synth: "brown", label: "Generated" },
    { title: "Pink Noise", kind: "synth", synth: "pink", label: "Generated" },
  ];
  const FACE = { happy: "Happy", focused: "Focused", worried: "Needs you", sad: "Struggling", proud: "Done" };

  const state = {
    tab: "Home",
    mode: "idle",
    endsAt: null,
    startedAt: null,
    secondsLeft: 0,
    selectedMinutes: 30,
    exitsLeft: 0,
    maxExits: 0,
    lidClosed: true,
    face: "happy",
    message: null,
    digest: null,
    urgent: false,
    todos: [],
    theme: "dark",
    playing: false,
    track: 0,
    tracks: [SILENCE, ...SYNTH],
    audioError: null,
    linked: false,
    online: navigator.onLine,
    bt: { available: false, powered: false, devices: [], connected: null, loading: true },
    weather: { loading: true, error: null, loc: null, current: null, daily: null },
    popover: null,
    ip: null,
    hostname: null,
    ssid: null,
    lastSync: null,
  };

  const $ = (id) => document.getElementById(id);
  const frame = $("frame");
  const mainEl = document.querySelector("main");
  const nav = $("nav");
  const hero = $("hero");
  const action = $("action");
  const track = $("track");
  const todoList = $("todoList");
  const todoCount = $("todoCount");
  const weatherWrap = $("weatherWrap");
  const trackGrid = $("trackGrid");
  const nowPlaying = $("nowPlaying");
  const audioNote = $("audioNote");
  const btList = $("btList");
  const btStatusText = $("btStatusText");
  const wifiState = $("wifiState");
  const wifiSsid = $("wifiSsid");
  const wifiIp = $("wifiIp");
  const wifiHost = $("wifiHost");
  const linkState = $("linkState");
  const linkAddr = $("linkAddr");
  const linkSync = $("linkSync");
  const player = $("player");

  let skew = 0;
  let holding = false;
  let holdTimer = null;
  let holdStart = 0;
  let suppressClickUntil = 0;
  let todoKey = "";
  let musicKey = "";
  let weatherKey = "";

  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';

  const pad = (n) => String(n).padStart(2, "0");
  const nowS = () => Date.now() / 1000 + skew;
  const clockText = () => { const d = new Date(); return `${d.getHours() % 12 || 12}:${pad(d.getMinutes())}`; };
  const countdownText = () => {
    const s = Math.max(0, state.secondsLeft);
    return s >= 3600
      ? `${Math.floor(s / 3600)}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`
      : `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  };
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const TABS = ["Home", "To-do", "Weather", "Music"];

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2600);
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
    let data = null;
    try { data = await res.json(); } catch (e) { /* empty body */ }
    if (!res.ok) throw new Error((data && data.detail) || `Request failed (${res.status})`);
    return data;
  }
  const post = (p, b) => api(p, { method: "POST", body: JSON.stringify(b || {}) });

  /* ---------- navigation ---------- */
  function renderNav() {
    nav.innerHTML = TABS.map((t) =>
      `<button type="button" class="seg${t === state.tab ? " active" : ""}" data-tab="${t}">${t}</button>`
    ).join("");
  }

  function slideTo() {
    const idx = Math.max(0, TABS.indexOf(state.tab));
    track.style.transform = `translateX(${-idx * 100}%)`;
  }

  /* ---------- home ---------- */
  function renderHome() {
    if (holding) return;

    if (state.mode === "locked") {
      hero.innerHTML = `
        <div class="clock small" id="homeBig">${countdownText()}</div>
        <div class="subclock" id="homeSub">${clockText()} · ${state.exitsLeft} of ${state.maxExits} exits · ${FACE[state.face] || "Focused"}</div>`;

      const m = state.message;
      const d = state.digest;
      const urgent = !!(m && m.urgent && state.urgent);
      const info = [
        m ? `<div class="msg-card${urgent ? " urgent" : ""}">
               <span class="txt"><span class="who">${esc(m.from)}:</span> ${esc(m.text)}</span>
               ${urgent ? '<button class="act" id="freeBtn" type="button">Unlock free</button>' : ""}
             </div>` : "",
        d ? `<div class="digest-line">${esc(d.text)}</div>` : "",
      ].join("");

      const dead = state.exitsLeft <= 0;
      action.innerHTML = `
        ${info ? `<div class="locked-info">${info}</div>` : ""}
        <button type="button" class="hold" id="hold" ${dead ? "disabled" : ""}>
          <span class="hold-fill" id="holdFill"></span>
          <span class="hold-label" id="holdLabel">${dead ? "No emergency exits left" : "Hold 3s for Emergency Exit"}</span>
        </button>`;
      wireHold();
      if (urgent) $("freeBtn").onclick = unlockFree;
    } else {
      hero.innerHTML = `<div class="clock" id="homeBig">${clockText()}</div>`;
      action.innerHTML = `
        <div>
          <div class="action-row">
            <div class="pills">
              ${DURATIONS.map((m) =>
                `<button type="button" class="pill${m === state.selectedMinutes ? " active" : ""}" data-min="${m}">${m}m</button>`
              ).join("")}
            </div>
            <button type="button" class="lock-btn" id="lock" ${state.lidClosed ? "" : "disabled"}>Lock In</button>
          </div>
          <div class="hint">${state.lidClosed ? "Phone in the box — close the lid, then lock in" : "Close the lid to lock in"}</div>
        </div>`;
    }
  }

  function updateHomeText() {
    const big = $("homeBig");
    if (!big) return;
    if (state.mode === "locked") {
      big.textContent = countdownText();
      const sub = $("homeSub");
      if (sub) sub.textContent = `${clockText()} · ${state.exitsLeft} of ${state.maxExits} exits · ${FACE[state.face] || "Focused"}`;
    } else {
      big.textContent = clockText();
    }
  }

  function wireHold() {
    const btn = $("hold");
    if (!btn) return;
    const fill = $("holdFill");
    const label = $("holdLabel");

    const stop = () => {
      holding = false;
      clearInterval(holdTimer);
      holdTimer = null;
      if (fill) fill.style.width = "0%";
      if (label) label.textContent = "Hold 3s for Emergency Exit";
    };

    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      holding = true;
      holdStart = Date.now();
      holdTimer = setInterval(() => {
        const pct = Math.min(((Date.now() - holdStart) / 3000) * 100, 100);
        if (fill) fill.style.width = pct + "%";
        if (label) label.textContent = "Keep holding to exit…";
        if (pct >= 100) {
          stop();
          post("/unlock", { reason: "emergency" })
            .then((s) => { apply(s); toast("Emergency exit used"); })
            .catch((err) => toast(err.message));
        }
      }, 25);
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => btn.addEventListener(ev, stop));
  }

  async function lockIn() {
    if (!state.lidClosed) return toast("Close the lid first");
    const btn = $("lock");
    if (btn) btn.disabled = true;
    try { apply(await post("/lock", { minutes: state.selectedMinutes })); }
    catch (err) { toast(err.message); if (btn) btn.disabled = false; }
  }

  async function unlockFree() {
    try { apply(await post("/unlock", { reason: "urgent" })); toast("Unlocked for the urgent message"); }
    catch (err) { toast(err.message); }
  }

  /* ---------- to-do ---------- */
  function renderTodos() {
    const key = JSON.stringify(state.todos);
    if (key === todoKey) return;
    todoKey = key;

    const remaining = state.todos.filter((t) => !t.done).length;
    todoCount.textContent = `${remaining} remaining`;
    $("todoFoot").textContent = state.todos.length ? "Tap to tick off · × removes · + adds" : "Tap + to add a reminder on the Pi";

    if (!state.todos.length) {
      todoList.innerHTML = '<div class="empty-list">No reminders yet</div>';
      return;
    }
    todoList.innerHTML = state.todos.slice().reverse().map((t) => `
      <div class="todo${t.done ? " done" : ""}" data-id="${esc(t.id)}" role="button" tabindex="0">
        <span class="check">${CHECK_SVG}</span>
        <span class="text">${esc(t.text)}</span>
        ${t.from && t.from !== "Me" && t.from !== "Pi" ? `<span class="from">${esc(t.from)}</span>` : ""}
        <button class="del" data-del="${esc(t.id)}" type="button" aria-label="Delete reminder">×</button>
      </div>`).join("");
  }

  async function toggleTodo(id) {
    try { apply(await post(`/todo/${encodeURIComponent(id)}/toggle`)); }
    catch (err) { toast(err.message); }
  }
  async function deleteTodo(id) {
    try { apply(await api(`/todo/${encodeURIComponent(id)}`, { method: "DELETE" })); }
    catch (err) { toast(err.message); }
  }

  /* ---------- add-reminder sheet ---------- */
  const KEYS = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];

  function buildKeyboard() {
    const rows = KEYS.map((row) =>
      `<div class="krow">${row.split("").map((k) => `<button class="key" data-key="${k}" type="button">${k}</button>`).join("")}</div>`
    ).join("");
    $("keyboard").innerHTML = rows + `
      <div class="krow">
        <button class="key space" data-key=" " type="button">space</button>
        <button class="key wide" data-back type="button">⌫</button>
        <button class="key go" data-add type="button">Add</button>
      </div>`;
  }

  function openSheet() {
    closePopover();
    $("addInput").value = "";
    $("sheet").classList.add("open");
    setTimeout(() => $("addInput").focus({ preventScroll: true }), 30);
  }
  function closeSheet() {
    $("sheet").classList.remove("open");
    $("addInput").blur();
  }

  async function submitTodo() {
    const text = $("addInput").value.replace(/\s+/g, " ").trim();
    if (!text) return toast("Type something first");
    try {
      apply(await post("/todo", { text, from: "Pi" }));
      closeSheet();
      toast("Reminder added");
    } catch (err) { toast(err.message); }
  }

  /* ---------- weather ---------- */
  const CONDITION = {
    0: ["Clear", "sun"], 1: ["Mostly clear", "sun"], 2: ["Partly cloudy", "cloud-sun"], 3: ["Overcast", "cloud"],
    45: ["Fog", "fog"], 48: ["Freezing fog", "fog"],
    51: ["Light drizzle", "rain"], 53: ["Drizzle", "rain"], 55: ["Heavy drizzle", "rain"],
    56: ["Freezing drizzle", "rain"], 57: ["Freezing drizzle", "rain"],
    61: ["Light rain", "rain"], 63: ["Rain", "rain"], 65: ["Heavy rain", "rain"],
    66: ["Freezing rain", "rain"], 67: ["Freezing rain", "rain"],
    71: ["Light snow", "snow"], 73: ["Snow", "snow"], 75: ["Heavy snow", "snow"], 77: ["Snow grains", "snow"],
    80: ["Rain showers", "rain"], 81: ["Rain showers", "rain"], 82: ["Violent showers", "rain"],
    85: ["Snow showers", "snow"], 86: ["Snow showers", "snow"],
    95: ["Thunderstorm", "storm"], 96: ["Thunderstorm", "storm"], 99: ["Thunderstorm", "storm"],
  };

  const WICON = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.4M12 19.2v2.4M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.4 12h2.4M19.2 12h2.4M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"/></svg>',
    "cloud-sun": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="3"/><path d="M8.5 2.6v1.4M3.4 8H2M4.6 4.1L4 3.5M13.7 6.3l.6-.6"/><path d="M7 17.5h9.5a3 3 0 0 0 .2-6 4.2 4.2 0 0 0-7.9-.7A3.4 3.4 0 0 0 7 17.5z"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 18h10.8a3.4 3.4 0 0 0 .3-6.8 4.8 4.8 0 0 0-9.1-.8A3.9 3.9 0 0 0 6.5 18z"/></svg>',
    rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15h10.8a3.4 3.4 0 0 0 .3-6.8 4.8 4.8 0 0 0-9.1-.8A3.9 3.9 0 0 0 6.5 15z"/><path d="M8.5 18.2l-.8 2M12 18.2l-.8 2M15.5 18.2l-.8 2"/></svg>',
    snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.5 14h10.8a3.4 3.4 0 0 0 .3-6.8 4.8 4.8 0 0 0-9.1-.8A3.9 3.9 0 0 0 6.5 14z"/><path d="M8.5 17.5v3M7.2 18.7h2.6M15 17.5v3M13.7 18.7h2.6M11.8 17.5v2.5M10.7 18.6h2.2"/></svg>',
    storm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 14h10.8a3.4 3.4 0 0 0 .3-6.8 4.8 4.8 0 0 0-9.1-.8A3.9 3.9 0 0 0 6.5 14z"/><path d="M12.8 16l-2.2 3.4h2.6L11.5 23"/></svg>',
    fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9.5h16M3 13h18M5 16.5h14M7 20h10"/></svg>',
  };

  let weatherLoc = null;
  try { weatherLoc = JSON.parse(localStorage.getItem("weatherLoc") || "null"); } catch (e) { weatherLoc = null; }

  function renderWeather() {
    const w = state.weather;
    const key = JSON.stringify(w);
    if (key === weatherKey) return;
    weatherKey = key;

    if (w.loading && !w.current) {
      weatherWrap.innerHTML = '<div class="weather-card"><div class="weather-msg">Loading weather…</div></div>';
      return;
    }
    if (w.error) {
      weatherWrap.innerHTML = `<div class="weather-card"><div class="weather-msg">${esc(w.error)}</div></div>`;
      return;
    }
    const code = w.current ? w.current.weather_code : 0;
    const [label, icon] = CONDITION[code] || ["Weather", "cloud"];
    const temp = w.current ? Math.round(w.current.temperature_2m) : "--";
    const feels = w.current ? Math.round(w.current.apparent_temperature) : "--";
    const wind = w.current ? Math.round(w.current.wind_speed_10m) : "--";
    const hum = w.current ? Math.round(w.current.relative_humidity_2m) : "--";
    const hi = w.daily ? Math.round(w.daily.temperature_2m_max[0]) : "--";
    const lo = w.daily ? Math.round(w.daily.temperature_2m_min[0]) : "--";

    weatherWrap.innerHTML = `
      <div class="weather-card">
        <div class="weather-top">
          <span class="weather-loc">${esc(w.loc ? w.loc.name : "Local")}</span>
          <span class="weather-updated">${new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</span>
        </div>
        <div class="weather-main">
          <span class="weather-icon">${WICON[icon]}</span>
          <span class="weather-temp">${temp}°</span>
        </div>
        <div class="weather-cond">${label} · H ${hi}° L ${lo}°</div>
        <div class="weather-details">
          <span>Feels like <b>${feels}°</b></span>
          <span>Wind <b>${wind} km/h</b></span>
          <span>Humidity <b>${hum}%</b></span>
        </div>
      </div>`;
  }

  async function loadWeather(force = false) {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem("weatherCache") || "null"); } catch (e) { cached = null; }
    if (!force && cached && Date.now() - cached.at < 15 * 60 * 1000) {
      state.weather = cached.data;
      if (state.weather.loc) weatherLoc = state.weather.loc;
      renderWeather();
      return;
    }
    state.weather = { ...state.weather, loading: true, error: null };
    renderWeather();
    try {
      if (!weatherLoc) {
        const ip = await fetch("https://ipapi.co/json/").then((r) => r.json());
        if (!ip || !ip.latitude) throw new Error("no location");
        weatherLoc = { name: ip.city || ip.region || "Local", lat: ip.latitude, lon: ip.longitude };
        localStorage.setItem("weatherLoc", JSON.stringify(weatherLoc));
      }
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${weatherLoc.lat}&longitude=${weatherLoc.lon}`
        + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m"
        + "&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1";
      const data = await fetch(url).then((r) => r.json());
      if (!data.current) throw new Error("no data");
      state.weather = { loading: false, error: null, loc: weatherLoc, current: data.current, daily: data.daily };
      localStorage.setItem("weatherCache", JSON.stringify({ at: Date.now(), data: state.weather }));
    } catch (err) {
      state.weather = { loading: false, error: "Weather needs an internet connection", loc: weatherLoc, current: null, daily: null };
    }
    renderWeather();
  }

  /* ---------- bluetooth ---------- */
  function renderBt() {
    const bt = state.bt;
    if (bt.loading) btStatusText.textContent = "Checking…";
    else if (!bt.available) btStatusText.textContent = "Bluetooth audio is only available on the Pi (BlueZ + bluetoothctl).";
    else if (bt.connected) btStatusText.textContent = `Connected to ${bt.connected.name}`;
    else btStatusText.textContent = bt.powered ? "Not connected — pick a speaker or headphones" : "Bluetooth adapter is powered off";

    if (!bt.devices || !bt.devices.length) {
      btList.innerHTML = bt.available ? '<div class="sub">No known devices. Scan to pair a speaker.</div>' : "";
      return;
    }
    btList.innerHTML = bt.devices.map((d) => `
      <div class="bt-device">
        <div>
          <div class="name">${esc(d.name || "Unknown device")}</div>
          <div class="addr">${esc(d.mac || "")}</div>
        </div>
        <button class="bt-act" data-bt="${esc(d.mac || "")}" type="button">Connect</button>
      </div>`).join("");
  }

  async function loadBt() {
    try {
      state.bt = { ...(await api("/bluetooth/status")), loading: false };
    } catch (e) {
      state.bt = { available: false, powered: false, devices: [], connected: null, loading: false };
    }
    renderIcons();
    renderBt();
  }

  /* ---------- music ---------- */
  const audio = {
    ctx: null,
    source: null,
    noise(kind) {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
      this.stop();

      const ctx = this.ctx;
      const buffer = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
      const data = buffer.getChannelData(0);

      if (kind === "brown") {
        let last = 0;
        for (let i = 0; i < data.length; i++) {
          const white = Math.random() * 2 - 1;
          last = (last + 0.02 * white) / 1.02;
          data[i] = last * 3.2;
        }
      } else if (kind === "pink") {
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < data.length; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99765 * b0 + white * 0.099046;
          b1 = 0.963 * b1 + white * 0.296516;
          b2 = 0.57 * b2 + white * 1.052691;
          data[i] = (b0 + b1 + b2 + white * 0.1848) * 0.22;
        }
      } else {
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
      }

      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      const gain = ctx.createGain();
      gain.gain.value = 0.35;
      src.connect(gain).connect(ctx.destination);
      src.start();
      this.source = src;
    },
    stop() {
      if (this.source) {
        try { this.source.stop(); this.source.disconnect(); } catch (e) { /* already stopped */ }
        this.source = null;
      }
    },
  };

  function stopPlayback() {
    audio.stop();
    player.pause();
  }

  function playTrack(index, autoplay = true) {
    stopPlayback();
    state.track = index;
    state.audioError = null;
    const t = state.tracks[index];

    if (!t) return;

    if (t.kind === "silence") {
      state.track = index;
      state.playing = false;
      renderMusic();
      return;
    }

    if (t.kind === "synth") {
      if (autoplay) { audio.noise(t.synth); state.playing = true; }
    } else {
      player.src = t.url;
      if (autoplay) {
        player.play().then(() => { state.playing = true; renderMusic(); }).catch(() => {
          state.playing = false;
          state.audioError = "Couldn't play that file — check pi/static/music/";
          renderMusic();
        });
      }
    }
    renderMusic();
  }

  function renderMusic(force = false) {
    const key = JSON.stringify([state.tracks, state.track, state.playing, state.audioError]);
    if (!force && key === musicKey) return;
    musicKey = key;

    const t = state.tracks[state.track];
    const live = !!(t && t.kind !== "silence" && state.playing);
    nowPlaying.textContent = !t || t.kind === "silence" ? "Silence" : live ? t.title : "Nothing playing";

    trackGrid.innerHTML = state.tracks.map((item, i) => {
      const active = i === state.track;
      const cls = active ? (live ? " playing" : " selected") : "";
      const viz = !active ? "" : item.kind === "silence"
        ? '<span class="viz muted"><i></i><i></i><i></i><i></i></span>'
        : '<span class="viz"><i></i><i></i><i></i><i></i></span>';
      return `<button type="button" class="tile${cls}" data-track="${i}">
        <span class="t">${esc(item.title)}</span>
        <span class="k">${esc(item.label)}</span>
        ${viz}
      </button>`;
    }).join("");

    audioNote.textContent = state.audioError
      || (t && t.kind === "synth" ? "Generated live on the Pi — no audio files needed" : t && t.kind === "silence" ? "Nothing playing" : "");
  }

  async function loadMusic() {
    let files = [];
    try { files = await api("/music"); } catch (e) { files = []; }
    state.tracks = [
      SILENCE,
      ...SYNTH,
      ...files.map((f) => ({ title: f.title, kind: "file", url: f.url, label: "On the Pi" })),
    ];
    if (state.track >= state.tracks.length) state.track = 0;
    renderMusic(true);
  }

  /* ---------- status icons + popovers ---------- */
  function renderIcons() {
    const wifi = $("wifiIcon");
    const link = $("linkIcon");
    const bt = $("btBtn");

    wifi.className = "icon " + (state.online ? "is-on" : "is-off");
    link.className = "icon " + (state.linked ? "is-on" : "is-off");
    if (!state.bt.available) bt.className = "icon is-off";
    else if (state.bt.connected) bt.className = "icon is-blue";
    else bt.className = "icon";

    wifiState.textContent = state.online ? "Connected" : "Offline";
    wifiSsid.textContent = state.ssid || (state.online ? "Wired / unknown" : "—");
    wifiIp.textContent = state.ip ? `${state.ip}:8000` : "—";
    wifiHost.textContent = state.hostname || "—";

    linkState.textContent = state.linked ? "Pi serving this screen" : "Reconnecting…";
    linkAddr.textContent = location.host;
    linkSync.textContent = state.lastSync
      ? state.lastSync.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" })
      : "—";

    document.querySelectorAll("#themeToggle button").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.theme === state.theme);
    });
  }

  function closePopover() {
    state.popover = null;
    document.querySelectorAll(".icon-wrap").forEach((w) => w.classList.remove("open"));
  }

  function togglePopover(name) {
    const wrap = document.querySelector(`.icon-wrap[data-popover="${name}"]`);
    const wasOpen = state.popover === name;
    closePopover();
    if (wasOpen || !wrap) return;
    state.popover = name;
    wrap.classList.add("open");
    if (name === "bt") loadBt();
    renderIcons();
  }

  function applyTheme(theme) {
    state.theme = theme;
    document.body.classList.toggle("light", theme === "light");
    localStorage.setItem("theme", theme);
    renderIcons();
  }

  /* ---------- render ---------- */
  function renderAll() {
    if (!TABS.includes(state.tab)) state.tab = "Home";
    frame.classList.toggle("locked", state.mode === "locked");
    renderNav();
    renderHome();
    renderTodos();
    renderWeather();
    renderMusic();
    renderIcons();
    renderBt();
    slideTo();
  }

  /* ---------- server state (CONTRACT.md) ---------- */
  function apply(s) {
    if (typeof s.server_time === "number") skew = s.server_time - Date.now() / 1000;

    state.mode = s.mode === "locked" ? "locked" : "idle";
    state.endsAt = s.ends_at || null;
    state.startedAt = s.started_at || null;
    state.exitsLeft = Number(s.exits_left) || 0;
    state.maxExits = Number(s.max_exits) || 0;
    state.lidClosed = s.lid_closed !== false;
    state.face = s.face || "happy";
    state.message = s.last_message || null;
    state.digest = s.last_digest || null;
    state.urgent = !!s.urgent_pending;
    state.todos = Array.isArray(s.todos) ? s.todos : [];
    state.secondsLeft = state.endsAt ? Math.max(0, Math.ceil(state.endsAt - nowS())) : 0;
    state.linked = true;
    state.lastSync = new Date();

    renderAll();
  }

  /* ---------- polling ---------- */
  async function poll() {
    try {
      apply(await api("/state"));
    } catch (e) {
      state.linked = false;
      renderIcons();
    }
  }

  /* ---------- events ---------- */
  nav.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-tab]");
    if (!btn) return;
    state.tab = btn.dataset.tab;
    renderNav();
    slideTo();
  });

  action.addEventListener("click", (e) => {
    const pill = e.target.closest("[data-min]");
    if (pill) {
      state.selectedMinutes = Number(pill.dataset.min);
      renderHome();
      return;
    }
    if (e.target.closest("#lock")) lockIn();
  });

  todoList.addEventListener("click", (e) => {
    const del = e.target.closest("[data-del]");
    if (del) return deleteTodo(del.dataset.del);
    const row = e.target.closest("[data-id]");
    if (row) toggleTodo(row.dataset.id);
  });

  $("addBtn").addEventListener("click", openSheet);
  $("sheetCancel").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });

  $("keyboard").addEventListener("click", (e) => {
    const key = e.target.closest("[data-key]");
    const back = e.target.closest("[data-back]");
    const add = e.target.closest("[data-add]");
    const input = $("addInput");
    if (key) { input.value += key.dataset.key; input.focus({ preventScroll: true }); }
    else if (back) { input.value = input.value.slice(0, -1); input.focus({ preventScroll: true }); }
    else if (add) submitTodo();
  });

  $("addInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); submitTodo(); }
    if (e.key === "Escape") closeSheet();
  });

  trackGrid.addEventListener("click", (e) => {
    const tile = e.target.closest("[data-track]");
    if (!tile) return;
    const i = Number(tile.dataset.track);
    const item = state.tracks[i];
    if (!item) return;
    if (item.kind === "silence") return playTrack(i);      // back to silence
    if (i === state.track && state.playing) return playTrack(0);  // tapping the playing box stops it
    playTrack(i, true);
  });

  player.addEventListener("error", () => {
    const t = state.tracks[state.track];
    if (t && t.kind === "file") {
      state.playing = false;
      state.audioError = "Couldn't play that file — check pi/static/music/";
      renderMusic();
    }
  });

  document.querySelectorAll(".icon-wrap > .icon").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      togglePopover(btn.parentElement.dataset.popover);
    });
  });

  document.addEventListener("click", (e) => {
    if (state.popover && !e.target.closest(".icon-wrap")) closePopover();
  });

  $("themeToggle").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-theme]");
    if (btn) applyTheme(btn.dataset.theme);
  });

  btList.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-bt]");
    if (!btn) return;
    btn.textContent = "Connecting…";
    btn.disabled = true;
    try { await post("/bluetooth/connect", { mac: btn.dataset.bt }); }
    catch (err) { toast(err.message); }
    setTimeout(loadBt, 1200);
  });

  $("btScan").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.textContent = "Scanning (8s)…";
    btn.disabled = true;
    try { await post("/bluetooth/scan"); } catch (err) { toast(err.message); }
    btn.textContent = "Scan for devices";
    btn.disabled = false;
    loadBt();
  });

  window.addEventListener("online", () => { state.online = true; renderIcons(); loadWeather(true); });
  window.addEventListener("offline", () => { state.online = false; renderIcons(); });

  /* ---------- swipe between tabs ----------
     Listeners live on window so a scroll container can never swallow pointerup
     and strand the screen on one tab. `touch-action: pan-y` on main keeps
     vertical scrolling native while horizontal drags come to us. */
  let drag = null;
  const SWIPE_THRESHOLD = 60;

  mainEl.addEventListener("pointerdown", (e) => {
    if (state.popover) { closePopover(); return; }
    if ($("sheet").classList.contains("open")) return;
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, active: false };
  });

  window.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0;
    const dy = e.clientY - drag.y0;
    if (!drag.active) {
      if (Math.abs(dx) < 14 || Math.abs(dx) <= Math.abs(dy)) return;
      drag.active = true;
      track.style.transition = "none";
    }
    const idx = Math.max(0, TABS.indexOf(state.tab));
    const atEdge = (dx > 0 && idx === 0) || (dx < 0 && idx === TABS.length - 1);
    drag.dx = atEdge ? dx * 0.3 : dx;
    track.style.transform = `translateX(calc(${-idx * 100}% + ${drag.dx}px))`;
  }, { passive: true });

  function endDrag() {
    if (!drag) return;
    const { active, dx } = drag;
    drag = null;
    if (!active) return;

    // a swipe must not also register as a tap on a reminder row or control
    suppressClickUntil = Date.now() + 400;
    track.style.transition = "";
    const idx = Math.max(0, TABS.indexOf(state.tab));
    if (dx <= -SWIPE_THRESHOLD && idx < TABS.length - 1) state.tab = TABS[idx + 1];
    else if (dx >= SWIPE_THRESHOLD && idx > 0) state.tab = TABS[idx - 1];
    renderNav();
    slideTo();
  }

  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  window.addEventListener("blur", () => { drag = null; });
  document.addEventListener("visibilitychange", () => { if (document.hidden) drag = null; });

  document.addEventListener("click", (e) => {
    if (Date.now() < suppressClickUntil) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  /* ---------- clock + countdown ---------- */
  setInterval(() => {
    if (state.mode !== "locked" || !state.endsAt) return;
    const left = Math.max(0, Math.ceil(state.endsAt - nowS()));
    if (left !== state.secondsLeft || state.tab === "Home") {
      state.secondsLeft = left;
      updateHomeText();
    }
  }, 250);

  /* ---------- fit 800x480 without cropping ---------- */
  const stage = $("stage");
  function fit() {
    const scale = Math.min(1, innerWidth / 800, innerHeight / 480);
    stage.style.transform = scale < 1 ? `scale(${scale})` : "none";
  }
  addEventListener("resize", fit);

  /* ---------- boot ---------- */
  buildKeyboard();
  applyTheme(localStorage.getItem("theme") === "light" ? "light" : "dark");
  fit();
  renderAll();
  loadBt();
  loadWeather();
  loadMusic();
  api("/network").then((n) => {
    state.ip = n.ip || null;
    state.hostname = n.hostname || null;
    state.ssid = n.ssid || null;
    renderIcons();
  }).catch(() => {});
  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
